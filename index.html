<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Combat Tools</title>
  <style>
    :root { --bg:#12151a; --bg2:#1a1f27; --border:#2e3848; --text:#e8edf5; --muted:#8b98ab; --accent:#8bb8c9; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Source Sans 3", system-ui, sans-serif;
      background: var(--bg); color: var(--text);
    }
    main { width: min(36rem, calc(100vw - 2rem)); }
    h1 { font-size: 1.1rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    p { color: var(--muted); font-size: .95rem; }
    .grid { display: grid; gap: .75rem; margin-top: 1.25rem; }
    a {
      display: block; padding: 1rem 1.15rem; border-radius: 12px;
      border: 1px solid var(--border); background: var(--bg2);
      color: var(--text); text-decoration: none;
    }
    a:hover { border-color: var(--accent); }
    a strong { display: block; font-size: 1.15rem; margin-bottom: .2rem; }
    a span { color: var(--muted); font-size: .88rem; }
  </style>
</head>
<body>
  <main>
    <h1>Combat Tools</h1>
    <p>Pöydän käyttötyökalut. Linkki on tarkoitettu pelaajille — ei julkiseen hakuun.</p>
    <div class="grid">
      <a href="./makhal.html"><strong>Makhal “Wildwalker” Nalakthai</strong><span>Goliath · Ranger L9</span></a>
      <a href="./kaelan.html"><strong>Kaelan Stormsoul</strong><span>Rune Knight · Fighter L9</span></a>
    </div>
  </main>
</body>
</html>
